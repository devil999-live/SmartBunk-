<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Bunk | Cyberpunk Attendance</title>
  
  <!-- Fonts: Orbitron for futuristic numbers, Inter for readable text -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Export Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Config & Cyberpunk Theme -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            cyber: ['Orbitron', 'sans-serif'],
          },
          colors: {
            bgDark: '#050816',
            glass: 'rgba(17, 25, 40, 0.75)',
            neon: {
              green: '#00ff88',
              red: '#ff3355',
              blue: '#00cfff',
              purple: '#8b5cf6',
              yellow: '#ffe600'
            }
          }
        }
      }
    }
  </script>

  <style>
    :root { color-scheme: dark; }
    body {
      background-color: #050816;
      color: #e2e8f0;
      overflow-x: hidden;
      margin: 0;
    }
    
    /* Animated Background Particles / Grid */
    .cyber-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: 
        linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }
    .cyber-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      z-index: -1;
      animation: float 10s infinite alternate ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; background: #8b5cf6; top: -100px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: #00cfff; bottom: -100px; right: -100px; animation-delay: -5s; }
    
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    /* Glassmorphism & Neon */
    .glass-card {
      background: rgba(17, 25, 40, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
    }
    
    .neon-border-green { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2), inset 0 0 10px rgba(0, 255, 136, 0.1); border-color: rgba(0, 255, 136, 0.5); }
    .neon-border-red { box-shadow: 0 0 10px rgba(255, 51, 85, 0.2), inset 0 0 10px rgba(255, 51, 85, 0.1); border-color: rgba(255, 51, 85, 0.5); }
    .neon-border-blue { box-shadow: 0 0 10px rgba(0, 207, 255, 0.2), inset 0 0 10px rgba(0, 207, 255, 0.1); border-color: rgba(0, 207, 255, 0.5); }
    
    .neon-text-green { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88; color: #00ff88; }
    .neon-text-red { text-shadow: 0 0 10px #ff3355, 0 0 20px #ff3355; color: #ff3355; }
    .neon-text-blue { text-shadow: 0 0 10px #00cfff, 0 0 20px #00cfff; color: #00cfff; }
    .neon-text-purple { text-shadow: 0 0 10px #8b5cf6, 0 0 20px #8b5cf6; color: #8b5cf6; }

    .btn-cyber { transition: all 0.3s ease; }
    .btn-cyber:hover { transform: scale(1.05); }
    .btn-cyber:active { transform: scale(0.97); }

    .btn-present { box-shadow: 0 0 10px #00ff88, 0 0 20px rgba(0,255,136,0.5); border: 1px solid #00ff88; color: #00ff88; }
    .btn-present:hover { background: rgba(0,255,136,0.1); box-shadow: 0 0 15px #00ff88, 0 0 30px #00ff88; }
    
    .btn-absent { box-shadow: 0 0 10px #ff3355, 0 0 20px rgba(255,51,85,0.5); border: 1px solid #ff3355; color: #ff3355; }
    .btn-absent:hover { background: rgba(255,51,85,0.1); box-shadow: 0 0 15px #ff3355, 0 0 30px #ff3355; }
    
    .btn-holiday { box-shadow: 0 0 10px #00cfff, 0 0 20px rgba(0,207,255,0.5); border: 1px solid #00cfff; color: #00cfff; }
    .btn-holiday:hover { background: rgba(0,207,255,0.1); box-shadow: 0 0 15px #00cfff, 0 0 30px #00cfff; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050816; }
    ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00cfff; }

    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .cyber-bg, .cyber-orb { display: none !important; }
      .glass-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important;}
      * { text-shadow: none !important; box-shadow: none !important; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0",
        "recharts": "https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <div class="cyber-bg"></div>
  <div class="cyber-orb orb-1"></div>
  <div class="cyber-orb orb-2"></div>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, BarChart, Bar } from 'recharts';
    import { 
      CheckCircle, XCircle, Calendar as CalendarIcon, Shield, Zap, TrendingUp, 
      Settings, Download, LogOut, ChevronRight, ChevronLeft, Trash2, Target, LayoutDashboard 
    } from 'lucide-react';
    
    // Firebase Imports
    import { initializeApp } from 'firebase/app';
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      signOut, onAuthStateChanged, signInWithCustomToken, GoogleAuthProvider, signInWithPopup 
    } from 'firebase/auth';
    import { 
      getFirestore, doc, setDoc, onSnapshot, collection, writeBatch, getDocs
    } from 'firebase/firestore';

    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const userFirebaseConfig = {
      apiKey: "AIzaSyCY_vrgdX4sB8CTr5IpLXGjJCyu09RmzR4",
      authDomain: "smartbunk-999.firebaseapp.com",
      projectId: "smartbunk-999",
      storageBucket: "smartbunk-999.firebasestorage.app",
      messagingSenderId: "1054512523346",
      appId: "1:1054512523346:web:9abc0b0f7f5e78b7b5178b"
    };
    
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const getDbPath = (userId, collectionName) => {
      if (typeof __app_id !== 'undefined') {
         return `artifacts/${__app_id}/users/${userId}/${collectionName}`;
      }
      return `users/${userId}/${collectionName}`;
    };

    // ==========================================
    // 2. HELPER FUNCTIONS (TIMEZONE SAFE)
    // ==========================================
    // Convert any Date object to exact YYYY-MM-DD local time string
    const toLocalYYYYMMDD = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const getToday = () => toLocalYYYYMMDD(new Date());

    const isSunday = (dateStr) => {
      // dateStr is 'YYYY-MM-DD'. Parse carefully to avoid timezone shift.
      const [y, m, d] = dateStr.split('-');
      return new Date(y, m - 1, d).getDay() === 0;
    };

    const getDatesBetween = (startDateStr, endDateStr) => {
      let dates = [];
      const [sy, sm, sd] = startDateStr.split('-');
      let currentDate = new Date(sy, sm - 1, sd);
      
      const [ey, em, ed] = endDateStr.split('-');
      const end = new Date(ey, em - 1, ed);
      
      while (currentDate <= end) {
        dates.push(toLocalYYYYMMDD(currentDate));
        currentDate.setDate(currentDate.getDate() + 1);
      }
      return dates;
    };

    // Math Calculations
    const calculateSafeBunks = (present, absent, required) => {
      if (present === 0 && absent === 0) return 0;
      let x = 0;
      while (((present) / (present + absent + x)) * 100 >= required) {
        x++;
      }
      return Math.max(0, x - 1);
    };

    const calculateRecoveryDays = (present, absent, required) => {
      if (present === 0 && absent === 0) return 0;
      let d = 0;
      while (((present + d) / (present + absent + d)) * 100 < required) {
        d++;
      }
      return d;
    };

    const calculatePercentage = (present, absent) => {
      if (present + absent === 0) return 0;
      return ((present / (present + absent)) * 100).toFixed(1);
    };

    // ==========================================
    // 3. COMPONENTS
    // ==========================================
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={onClose}>
          <motion.div 
            initial={{ scale: 0.9, opacity: 0 }}
            animate={{ scale: 1, opacity: 1 }}
            exit={{ scale: 0.9, opacity: 0 }}
            className="glass-card border border-neon-purple p-6 max-w-sm w-full relative"
            onClick={e => e.stopPropagation()}
          >
            <h3 className="text-xl font-cyber text-white mb-6 text-center">{title}</h3>
            {children}
          </motion.div>
        </div>
      );
    };

    const LoadingSpinner = () => (
      <div className="flex h-screen items-center justify-center">
        <motion.div
          animate={{ rotate: 360 }}
          transition={{ repeat: Infinity, duration: 1, ease: "linear" }}
          className="w-12 h-12 border-4 border-neon-purple border-t-transparent rounded-full"
        />
      </div>
    );

    // --- MAIN APP ---
    const App = () => {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [profile, setProfile] = useState(null);
      const [attendance, setAttendance] = useState({});
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isFirstLogin, setIsFirstLogin] = useState(false);

      useEffect(() => {
        const initAuth = async () => {
          try {
             if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            }
          } catch(e) {
             console.log("Custom token failed, relying on manual auth.");
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) {
          setProfile(null);
          setAttendance({});
          return;
        }

        let unsubProfile, unsubAttendance;

        const loadData = async () => {
          const profileDocRef = doc(db, getDbPath(user.uid, 'profile'), 'main');
          
          unsubProfile = onSnapshot(profileDocRef, (docSnap) => {
            if (docSnap.exists()) {
              setProfile(docSnap.data());
              setIsFirstLogin(false);
            } else {
              setIsFirstLogin(true);
            }
          });

          const attendanceRef = collection(db, getDbPath(user.uid, 'attendance'));
          unsubAttendance = onSnapshot(attendanceRef, (snapshot) => {
            const data = {};
            snapshot.forEach(d => { data[d.id] = d.data(); });
            setAttendance(data);
          });
        };
        loadData();

        return () => {
          if (unsubProfile) unsubProfile();
          if (unsubAttendance) unsubAttendance();
        };
      }, [user]);

      // Auto-Absent Logic
      useEffect(() => {
        if (profile?.createdAt && Object.keys(attendance).length > 0) {
          runAutoLogic();
        }
      }, [profile?.createdAt]);

      const runAutoLogic = async () => {
        if (!user || !profile) return;
        const startDate = profile.createdAt;
        const today = getToday();
        if (startDate === today) return; 

        const datesToCheck = getDatesBetween(startDate, today);
        datesToCheck.pop(); // Remove today

        const batch = writeBatch(db);
        let hasChanges = false;

        datesToCheck.forEach(date => {
          if (!attendance[date]) {
            const dateRef = doc(db, getDbPath(user.uid, 'attendance'), date);
            if (isSunday(date)) {
              batch.set(dateRef, { date, status: 'holiday', isHoliday: true, updatedAt: new Date().toISOString(), auto: true });
            } else {
              batch.set(dateRef, { date, status: 'absent', isHoliday: false, updatedAt: new Date().toISOString(), auto: true });
            }
            hasChanges = true;
          }
        });

        if (hasChanges) await batch.commit();
      };

      const setTargetPercentage = async (val) => {
        if (!user) return;
        await setDoc(doc(db, getDbPath(user.uid, 'profile'), 'main'), {
          email: user.email,
          requiredPercentage: val,
          createdAt: getToday(),
          updatedAt: new Date().toISOString()
        });
        setIsFirstLogin(false);
      };

      const handleMarkAttendance = async (dateStr, status) => {
        if (!user) return;
        const isHoliday = status === 'holiday';
        const docRef = doc(db, getDbPath(user.uid, 'attendance'), dateStr);
        await setDoc(docRef, {
          date: dateStr,
          status: status,
          isHoliday: isHoliday,
          updatedAt: new Date().toISOString(),
          auto: false 
        });
      };

      if (authLoading) return <LoadingSpinner />;
      if (!user) return <LandingPage />;
      if (isFirstLogin) return <SetupWizard onComplete={setTargetPercentage} />;

      // Compute metrics
      let present = 0, absent = 0, holiday = 0;
      Object.values(attendance).forEach(record => {
        if (record.status === 'present') present++;
        else if (record.status === 'absent') absent++;
        else if (record.status === 'holiday') holiday++;
      });
      
      const reqPercent = profile?.requiredPercentage || 75;
      const currentPercent = calculatePercentage(present, absent);
      const safeBunks = calculateSafeBunks(present, absent, reqPercent);
      const recDays = calculateRecoveryDays(present, absent, reqPercent);
      const isSafe = parseFloat(currentPercent) >= reqPercent;

      const NavItem = ({ id, icon: Icon, label }) => (
        <button 
          onClick={() => setCurrentTab(id)}
          className={`flex flex-col items-center p-3 sm:flex-row sm:space-x-3 w-full rounded-xl transition-all ${
            currentTab === id 
              ? 'bg-neon-purple/20 border border-neon-purple text-white shadow-[0_0_15px_rgba(139,92,246,0.3)]' 
              : 'text-gray-400 hover:text-white hover:bg-gray-800/50 border border-transparent'
          }`}
        >
          <Icon size={20} className={currentTab === id ? 'text-neon-purple drop-shadow-[0_0_8px_#8b5cf6]' : ''} />
          <span className={`text-xs sm:text-sm font-medium ${currentTab === id ? 'hidden sm:block' : 'hidden sm:block'}`}>{label}</span>
        </button>
      );

      return (
        <div className="flex flex-col sm:flex-row h-screen no-print">
          <nav className="sm:w-64 glass-card sm:rounded-none border-t sm:border-t-0 sm:border-r border-gray-800 p-2 sm:p-4 flex sm:flex-col justify-around sm:justify-start gap-2 order-2 sm:order-1 z-20">
            <div className="hidden sm:flex items-center gap-3 p-4 mb-8">
               <Shield className="text-neon-green" size={28} style={{ filter: 'drop-shadow(0 0 10px #00ff88)' }} />
               <h1 className="text-xl font-cyber font-bold tracking-wider">SAFE BUNK</h1>
            </div>
            <NavItem id="dashboard" icon={LayoutDashboard} label="Dashboard" />
            <NavItem id="calendar" icon={CalendarIcon} label="Calendar" />
            <NavItem id="calculator" icon={Zap} label="Calculator" />
            <NavItem id="analytics" icon={TrendingUp} label="Analytics" />
            <NavItem id="reports" icon={Download} label="Reports" />
            <NavItem id="settings" icon={Settings} label="Settings" />
          </nav>

          <main className="flex-1 overflow-y-auto p-4 sm:p-8 order-1 sm:order-2 pb-24 sm:pb-8 relative">
            <div className="max-w-5xl mx-auto space-y-8">
              <AnimatePresence mode="wait">
                {currentTab === 'dashboard' && (
                  <DashboardView key="dash" {...{present, absent, holiday, currentPercent, reqPercent, safeBunks, recDays, isSafe, handleMarkAttendance, attendance}} />
                )}
                {currentTab === 'calendar' && (
                  <MonthlyCalendarView key="cal" attendance={attendance} handleMarkAttendance={handleMarkAttendance} />
                )}
                {currentTab === 'calculator' && (
                  <CalculatorView key="calc" present={present} absent={absent} reqPercent={reqPercent} />
                )}
                {currentTab === 'analytics' && (
                  <AnalyticsView key="anal" attendance={attendance} present={present} absent={absent} holiday={holiday} />
                )}
                {currentTab === 'reports' && (
                  <ReportsView key="rep" attendance={attendance} profile={profile} present={present} absent={absent} currentPercent={currentPercent} />
                )}
                {currentTab === 'settings' && (
                  <SettingsView key="set" profile={profile} />
                )}
              </AnimatePresence>
            </div>
          </main>
        </div>
      );
    };

    // --- LANDING PAGE ---
    const LandingPage = () => {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        try {
          if (isLogin) await signInWithEmailAndPassword(auth, email, password);
          else await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) { setError(err.message); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="w-full max-w-md glass-card p-8 border-neon-purple relative overflow-hidden">
            <div className="absolute top-0 right-0 w-32 h-32 bg-neon-purple/20 blur-[50px] rounded-full"></div>
            <div className="absolute bottom-0 left-0 w-32 h-32 bg-neon-blue/20 blur-[50px] rounded-full"></div>

            <div className="text-center mb-8 relative z-10">
              <Shield className="mx-auto text-neon-green mb-4 drop-shadow-[0_0_15px_#00ff88]" size={48} />
              <h1 className="text-4xl font-cyber font-bold tracking-widest mb-2">𝐒𝐌𝐀𝐑𝐓 𝐁𝐔𝐍𝐊</h1>
              <p className="text-gray-400 text-sm italic">𝐊𝐧𝐨𝐰 𝐲𝐨𝐮𝐫 𝐚𝐭𝐭𝐞𝐧𝐝𝐚𝐧𝐜𝐞. 𝐂𝐨𝐧𝐭𝐫𝐨𝐥 𝐲𝐨𝐮𝐫 𝐛𝐮𝐧𝐤𝐬</p>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 relative z-10">
              <input type="email" placeholder="Email Array" required value={email} onChange={e => setEmail(e.target.value)}
                className="w-full bg-gray-900/50 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-neon-purple transition-all font-mono" />
              <input type="password" placeholder="Passcode" required value={password} onChange={e => setPassword(e.target.value)}
                className="w-full bg-gray-900/50 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-neon-purple transition-all font-mono" />
              
              {error && <p className="text-neon-red text-xs">{error}</p>}

              <button type="submit" className="w-full bg-neon-purple/20 border border-neon-purple text-neon-purple hover:bg-neon-purple/40 font-cyber font-bold rounded-lg p-3 transition-all hover:shadow-[0_0_15px_rgba(139,92,246,0.5)]">
                {isLogin ? 'INITIALIZE SYSTEM' : 'CREATE PROTOCOL'}
              </button>
            </form>

            <button onClick={() => signInWithPopup(auth, new GoogleAuthProvider())} className="mt-4 w-full bg-white/10 border border-gray-600 text-white hover:bg-white/20 font-cyber rounded-lg p-3 transition-all flex items-center justify-center gap-2 relative z-10">
              𝐆𝐨𝐨𝐠𝐥𝐞 𝐋𝐢𝐧𝐤
            </button>

            <p className="mt-6 text-center text-gray-400 text-sm relative z-10">
              {isLogin ? "New user?" : "Already registered?"} 
              <button onClick={() => setIsLogin(!isLogin)} className="ml-2 text-neon-blue hover:text-white underline decoration-neon-blue underline-offset-4">
                {isLogin ? 'Establish Connection' : 'Return to Login'}
              </button>
            </p>
          </motion.div>
        </div>
      );
    };

    // --- SETUP WIZARD ---
    const SetupWizard = ({ onComplete }) => {
      const [percent, setPercent] = useState(75);
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="max-w-md w-full glass-card border-neon-blue p-8 text-center">
            <Target className="mx-auto text-neon-blue mb-4 drop-shadow-[0_0_15px_#00cfff]" size={48} />
            <h2 className="text-2xl font-cyber font-bold mb-2">TARGET LOCK</h2>
            <p className="text-gray-400 mb-8">Set your required attendance threshold to initialize safe bunk calculations.</p>
            
            <div className="flex justify-center items-end gap-2 mb-8">
              <span className="text-5xl font-cyber font-bold text-neon-blue drop-shadow-[0_0_10px_#00cfff]">{percent}</span>
              <span className="text-2xl text-gray-500 mb-1">%</span>
            </div>
            <input type="range" min="50" max="100" value={percent} onChange={(e) => setPercent(parseInt(e.target.value))} className="w-full mb-8 accent-neon-blue" />

            <button onClick={handleDeleteData} className="w-full bg-red-950/40 border border-red-800 text-red-400 p-3 rounded font-bold">PURGE ATTENDANCE DATA</button>
          </div>
          <button onClick={() => signOut(auth)} className="w-full glass-card p-4 border border-gray-800 hover:border-gray-600 text-gray-400 flex justify-center gap-2"><LogOut size={18} /> TERMINATE SESSION</button>
        </motion.div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
